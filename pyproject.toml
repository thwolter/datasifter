[project]
name = "datasifter"
version = "0.1.0"
description = "Reusable extraction orchestration core with pluggable adapters."
readme = "README.md"
authors = [
    { name = "Thomas Wolter", email = "support@riskary.de" },
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8.0",
    "typing-extensions>=4.10.0",
    "langchain-core>=0.3.0",
]
keywords = ["llm", "extraction", "retrieval", "orchestration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/thwolter/datasifter"
Documentation = "https://github.com/thwolter/datasifter"
Issues = "https://github.com/thwolter/datasifter/issues"

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
[dependency-groups]
dev = [
    "commitizen>=4.9.1",
    "isort>=7.0.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.23",
    "pre-commit>=4.4.0",
    "pyrefly>=0.40.1",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.4",
    "ruff-format>=0.4.1",
    "ssort>=0.15.0",
]
